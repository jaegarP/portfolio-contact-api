AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Portfolio contact API (AWS version) - .NET 10 on AWS Lambda with a public Function URL,
  Amazon DynamoDB for message storage and Amazon SES for email notifications.
  Deploy with infra/aws/deploy-aws.ps1 (wraps "sam build" + "sam deploy").

Parameters:
  NotifyEmail:
    Type: String
    Description: Where enquiries are delivered. Must be verified in SES (the deploy script does this).
  SenderEmail:
    Type: String
    Default: ""
    Description: The "From" address. Leave empty to use NotifyEmail (simplest - one verified address).
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: https://jaegarp.github.io
    Description: Websites allowed to call the API from a browser.
  IpHashSalt:
    Type: String
    NoEcho: true
    Description: Random text mixed into visitor-IP hashes.

Conditions:
  UseNotifyAsSender: !Equals [!Ref SenderEmail, ""]

Resources:
  # ---------------- Database ----------------
  MessagesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain          # keep stored messages even if the stack is deleted
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST  # pay per read/write; always-free tier covers portfolio traffic
      AttributeDefinitions:
        - { AttributeName: Month, AttributeType: S }
        - { AttributeName: Id, AttributeType: S }
        - { AttributeName: IpHash, AttributeType: S }
        - { AttributeName: ReceivedAt, AttributeType: S }
      KeySchema:
        - { AttributeName: Month, KeyType: HASH }
        - { AttributeName: Id, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: ByIp
          KeySchema:
            - { AttributeName: IpHash, KeyType: HASH }
            - { AttributeName: ReceivedAt, KeyType: RANGE }
          Projection: { ProjectionType: KEYS_ONLY }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: false }

  # ---------------- API (Lambda) ----------------
  ContactFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../src/ContactApi.Aws/
      Handler: ContactApi.Aws          # executable assembly (ASP.NET Core minimal API + Lambda hosting)
      Runtime: dotnet10
      Architectures: [arm64]           # Graviton: cheaper and faster for .NET
      MemorySize: 512
      Timeout: 15
      Environment:
        Variables:
          AllowedOrigins: !Join [",", !Ref AllowedOrigins]
          MaxMessagesPerHour: "5"
          IpHashSalt: !Ref IpHashSalt
          DynamoDbTableName: !Ref MessagesTable
          NotifyEmail: !Ref NotifyEmail
          SenderEmail: !If [UseNotifyAsSender, !Ref NotifyEmail, !Ref SenderEmail]
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: "*"
              Condition:
                StringEquals:
                  "ses:FromAddress": !If [UseNotifyAsSender, !Ref NotifyEmail, !Ref SenderEmail]
      FunctionUrlConfig:
        AuthType: NONE                 # public endpoint (the code checks origin, rate limits and validates)
        Cors:
          AllowOrigins: !Ref AllowedOrigins
          AllowMethods: [POST]
          AllowHeaders: [content-type]
          MaxAge: 3600

  # Public Function URLs need both permissions (InvokeFunctionUrl is added by SAM above).
  ContactFunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ContactFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  ContactFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ContactFunction}
      RetentionInDays: 30             # keep CloudWatch log costs near zero

Outputs:
  ContactApiUrl:
    Description: Paste this into contact.apiUrls in the website's js/content.js
    Value: !Sub "${ContactFunctionUrl.FunctionUrl}api/contact"
  HealthUrl:
    Value: !Sub "${ContactFunctionUrl.FunctionUrl}api/health"
  MessagesTableName:
    Value: !Ref MessagesTable
