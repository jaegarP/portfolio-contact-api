# Runs the backend locally in Docker — no cloud account needed.
#
#   AZURE version:  docker compose up --build                 → http://localhost:7071/api/contact
#   AWS version:    docker compose --profile aws up --build   → http://localhost:7072/api/contact
#                   (the aws profile starts BOTH versions; add the service names to pick:
#                    docker compose --profile aws up --build dynamodb api-aws)
#   Stop:           docker compose --profile aws down         (add -v to also wipe stored messages)
#
# Services:
#   azurite  — Microsoft's Azure Storage emulator (Azure "ContactMessages" table)
#   api      — the Azure Functions version, built from Dockerfile
#   dynamodb — Amazon's DynamoDB Local (AWS "ContactMessages" table)     [profile: aws]
#   api-aws  — the AWS (Lambda / ASP.NET Core) version, built from Dockerfile.aws   [profile: aws]
#
# Email is not sent locally (no Azure/AWS email credentials) — the APIs log instead.

x-storage: &storage "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
# ^ Azurite's public, well-known development key — not a secret.

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --loose
    ports:
      - "10000:10000"   # blob
      - "10001:10001"   # queue
      - "10002:10002"   # table
    volumes:
      - azurite-data:/data

  api:
    build: .
    ports:
      - "7071:80"
    depends_on:
      - azurite
    environment:
      AzureWebJobsStorage: *storage
      MessagesStorageConnectionString: *storage
      MessagesTableName: ContactMessages
      AllowedOrigins: "http://localhost:5500,http://127.0.0.1:5500,http://localhost:5510"
      EnableCors: "true"
      MaxMessagesPerHour: "5"
      IpHashSalt: "local-docker"

  # ---------------- AWS version (profile: aws) ----------------
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    profiles: ["aws"]
    command: -jar DynamoDBLocal.jar -sharedDb -inMemory
    ports:
      - "8000:8000"

  api-aws:
    build:
      context: .
      dockerfile: Dockerfile.aws
    profiles: ["aws"]
    ports:
      - "7072:8080"
    depends_on:
      - dynamodb
    environment:
      AllowedOrigins: "http://localhost:5500,http://127.0.0.1:5500,http://localhost:5510"
      EnableCors: "true"
      MaxMessagesPerHour: "5"
      IpHashSalt: "local-docker"
      DynamoDbTableName: ContactMessages
      DynamoDbServiceUrl: "http://dynamodb:8000"
      DynamoDbCreateTable: "true"

volumes:
  azurite-data:
